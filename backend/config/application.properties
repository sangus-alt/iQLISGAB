
#General app configutaions

spring.application.name = iqlis2
application.version = v2.0.0
server.servlet.context-path=/
timezone = Africa/Accra

#options (development/production). Default is production
application.mode = development

application.otp_length = 4

#Hours
iqlis2.token_expiry =  720

iqlis2.general_acceptable_pattern = ^[a-zA-Z0-9 -@._]+$

spring.threads.virtual.enabled = false

springdoc.api-docs.path=/swagger-ui/api-docs

iqlis2.swagger.baseurl = http://localhost:8444

iqlis2.default.language = en

iqlis2.sync.daysold = 90

#management.server.port=9090
server.port= 8444
#server.address = 127.0.0.1
#server.error.whitelabel.enabled=true

#spring.thymeleaf.cache=false
#spring.thymeleaf.prefix=file:src/main/resources/templates/

server.tomcat.max-connections = 10000
server.tomcat.threads.max = 2500
server.tomcat.threads.min-spare = 5
server.tomcat.accept-count = 200
server.tomcat.max-http-form-post-size = 5MB
server.tomcat.max-swallow-size = 5MB
server.tomcat.redirect-context-root = false
server.tomcat.connection-timeout =5s
server.tomcat.keep-alive-timeout =1s


server.compression.enabled=true    
#Set the minimum response size that will trigger compression
server.compression.min-response-size=2KB
server.compression.mime-types=text/html,application/json

  
  
server.error.include-exception=false
server.error.include-message=always
server.error.include-stacktrace=on-param

#spring.mvc.throw-exception-if-no-handler-found=true
#spring.web.resources.add-mappings=true

spring.data.web.pageable.default-page-size = 1000

#Database configurations
spring.datasource.url=jdbc:mysql://localhost:3306/iqlis2_db
spring.datasource.username=root
spring.datasource.password=Stevo177
spring.jpa.show-sql = false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view = false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
#logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
#logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE


spring.datasource.hikari.maximum-pool-size = 500
spring.datasource.hikari.minimum-idle = 5


#Logging configurations
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate= INFO
logging.file.name =logs/iqlis2.log
logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss.SSS
logging.level.web = INFO


